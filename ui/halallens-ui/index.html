<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="HalalLens: a multi-agent research assistant for Bursa Malaysia stocks. Shariah status first, cited technicals and news, human-approved." />

    />
    <script>
      // Apply a saved theme before first paint, so there is no light flash in dark mode.
      try {
        var t = localStorage.getItem("hl-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
