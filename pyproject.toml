[project]
name = "halallens"
version = "0.1.0"
description = "Multi-agent research assistant for Bursa Malaysia stocks: Shariah status, technicals and news, with human approval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Orchestration + LLM
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",  # Claude models  (AGENT_MODEL=anthropic:...)
    "langchain-openai>=1.0",  # OpenAI models  (AGENT_MODEL=openai:...)
    "langchain-tavily",
    # Observability + evals
    "langfuse>=3.0",
    # Data + tools
    "pandas>=2.2",
    "yfinance",
    "rapidfuzz>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv",
    # API + UI
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "pdfplumber",  # scripts/parse_sc_list.py
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit list so CI doesn't change behaviour when ruff's defaults change.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is left to `ruff format`
