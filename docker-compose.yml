services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: halallens
      POSTGRES_PASSWORD: halallens
      POSTGRES_DB: halallens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halallens"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://halallens:halallens@postgres:5432/halallens
    ports:
      - "8010:8010"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    # React UI (ui/halallens-ui), served by nginx, which proxies /api to the api service.
    build: ./ui/halallens-ui
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
